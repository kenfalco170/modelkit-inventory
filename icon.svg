<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Sfondo Icona -->
  <rect width="512" height="512" rx="110" fill="#ffffff" stroke="#0055ff" stroke-width="14"/>
  
  <!-- Doppia Fascia Racing Rosso / Blu -->
  <rect x="0" y="40" width="512" height="24" fill="#e60012"/>
  <rect x="0" y="64" width="512" height="24" fill="#004098"/>
  
  <!-- Logo Twin Stars Tamiya Style al centro -->
  <g transform="translate(146, 120)">
    <!-- Rettangolo Rosso Stella Sinistra -->
    <rect x="0" y="0" width="100" height="90" fill="#e60012" rx="10"/>
    <polygon points="50,14 58,40 85,40 64,56 72,82 50,65 28,82 36,56 15,40 42,40" fill="#ffffff"/>
    
    <!-- Rettangolo Blu Stella Destra -->
    <rect x="115" y="0" width="100" height="90" fill="#004098" rx="10"/>
    <polygon points="165,14 173,40 200,40 179,56 187,82 165,65 143,82 151,56 130,40 157,40" fill="#ffffff"/>
  </g>
  
  <!-- Silhouette F1 Car da montare -->
  <g transform="translate(66, 230)">
    <path d="M 30,120 Q 90,110 150,105 L 210,95 Q 260,65 310,75 L 350,85 Q 365,95 370,110 L 370,135 L 10,135 Z" fill="#0055ff" opacity="0.18"/>
    <!-- Ala posteriore -->
    <rect x="15" y="60" width="30" height="55" fill="#004098" rx="4"/>
    <line x1="8" y1="60" x2="52" y2="60" stroke="#e60012" stroke-width="8"/>
    <!-- Ruota Posteriore -->
    <circle cx="85" cy="130" r="32" fill="#0a1f44" stroke="#ffffff" stroke-width="5"/>
    <circle cx="85" cy="130" r="12" fill="#c0d4ec"/>
    <!-- Abitacolo & Casco -->
    <path d="M 210,105 Q 235,75 260,105 Z" fill="#ffffff" stroke="#0a1f44" stroke-width="4"/>
    <circle cx="235" cy="90" r="12" fill="#e60012"/>
    <!-- Ruota Anteriore -->
    <circle cx="310" cy="130" r="28" fill="#0a1f44" stroke="#ffffff" stroke-width="5"/>
    <circle cx="310" cy="130" r="10" fill="#c0d4ec"/>
    <!-- Muso e Ala Anteriore -->
    <path d="M 330,120 L 375,128 L 375,135 L 320,135 Z" fill="#004098"/>
    <rect x="350,124" width="28" height="14" fill="#e60012" rx="2"/>
  </g>

  <!-- Titolo Inferiore Icona -->
  <rect x="50" y="405" width="412" height="52" rx="10" fill="#0a1f44"/>
  <text x="256" y="438" font-family="'Space Mono', monospace, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">MODEL KIT INVENTORY</text>
</svg>
